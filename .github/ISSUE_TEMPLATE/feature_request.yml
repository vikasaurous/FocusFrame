name: Feature Request
description: Suggest a new card, setting, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please describe what you'd like to see and why it would help.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain what you currently do and where you're running into friction.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature as clearly as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other ways you've tried to solve this?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Sketches, screenshots, links to similar features elsewhere — anything that helps.
